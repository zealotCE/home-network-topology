# Docker Compose 部署的示例运行配置。
# 不要在此文件中保存 SSH 密码、私钥或令牌。
# 这里只填写环境变量名；容器会在运行时解析它们。

dataDirectory: /data
discoveryIntervalSeconds: 900

ui:
  defaultView: setup
  setupHelpText: 已挂载 YAML 配置作为路由器默认值。请先测试基于密钥的 SSH 连接，再运行发现；私钥只保存在挂载文件中。

routers:
  - id: main-router
    label: 主 OpenWrt 路由器
    baseUrl: https://192.168.1.1
    username: root
    sshHost: 192.168.1.1
    sshPort: 22
    # 这里填写环境变量名；该变量的值应是容器内挂载私钥文件的路径，
    # 不是私钥内容。发现流程使用 OpenSSH 批处理模式，当前不支持 SSH 密码。
    identityFileEnvVar: OPENWRT_IDENTITY_FILE
